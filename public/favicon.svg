<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rail mark (src/ui/patterns/rail-mark.tsx): cyan #08B9E8 dot in a soft cyan halo. The halo follows the
       browser's color scheme, as the in-app mark follows the theme -->
  <style>
    .halo { fill: #08b9e8; fill-opacity: 0.2 }
    @media (prefers-color-scheme: dark) { .halo { fill-opacity: 0.3 } }
  </style>
  <circle class="halo" cx="16" cy="16" r="16" />
  <circle cx="16" cy="16" r="8" fill="#08b9e8" />
</svg>
