name: CI

# push as well as pull_request: KAN-156 and earlier stories commit straight
# to main (pr: false) in this repo's current delivery workflow, so a
# PR-only trigger would never run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel in-flight PR runs when a new push supersedes them — never a
  # push to main, where every commit must get its own pass/fail result for
  # the story close-out check (react-frontend-stack-decision.md §9) to read.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-lint-unit:
    name: typecheck, lint, unit tests
    # Pinned rather than ubuntu-latest: avoids an unplanned break when
    # GitHub rolls ubuntu-latest onto a new Ubuntu major.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: e2e tests (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          # playwright.config.ts's `reporter` is `list` only (no HTML
          # report) and `trace` is `on-first-retry` — this is traces for
          # any retried test, not a full report; named accordingly.
          name: playwright-test-results
          path: test-results/
          retention-days: 7
